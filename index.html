<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Consulta Estado FISE
</title>


<style>

body{

font-family:Arial,sans-serif;

background:
url('electrocentro.png')
no-repeat center center fixed;

background-size:contain;

background-color:#003366;

margin:0;
padding:0;

color:white;

text-align:center;

}


.container{

background-color:
rgba(0,0,0,0.60);

margin:5% auto;

padding:25px;

border-radius:10px;

overflow-x:auto;

width:90%;

max-width:700px;

}


input,
button,
select{

width:80%;

padding:12px;

margin-top:10px;

font-size:16px;

border:none;

border-radius:5px;

}


button{

background:#007bff;

color:white;

cursor:pointer;

font-weight:bold;

}


button:hover{

background:#0056b3;

}


table{

margin-top:20px;

width:100%;

border-collapse:collapse;

table-layout:fixed;     /* distribuye ancho */

font-size:14px;

}


th,
td{

border:1px solid white;

padding:10px;

vertical-align:middle;

word-wrap:break-word;

overflow-wrap:break-word;

text-align:center;

}

  /* DNI */

th:nth-child(1),
td:nth-child(1){

width:10%;

white-space:nowrap;

}


/* SUMINISTRO */

th:nth-child(2),
td:nth-child(2){

width:12%;

white-space:nowrap;

}


/* NOMBRE */

th:nth-child(3),
td:nth-child(3){

width:22%;

}


/* BENEFICIARIO */

th:nth-child(4),
td:nth-child(4){

width:22%;

}


/* ESTADO */

th:nth-child(5),
td:nth-child(5){

width:10%;

white-space:nowrap;

}


/* OBSERVACIONES */

th:nth-child(6),
td:nth-child(6){

width:24%;

}


th{

background:#004080;

}


#loading{

display:none;

margin-top:20px;

font-weight:bold;

}


</style>

</head>



<body>


<div class="container">


<h1>

CONSULTA ESTADO FISE

</h1>



<select
id="tipoBusqueda"
onchange="cambiarPlaceholder()">

<option value="DNI">

Buscar por DNI

</option>


<option value="SUMINISTRO">

Buscar por SUMINISTRO

</option>

</select>



<input
type="text"

id="datoInput"

placeholder="Ingrese DNI">



<button onclick="buscar()">

CONSULTAR

</button>



<div id="loading">

Buscando información...

</div>




<table
id="resultado"

style="display:none;">


<thead>

<tr>

<th>DNI</th>

<th>SUMINISTRO</th>

<th>NOMBRE DEL USUARIO</th>

<th>TIPO BENEFICIARIO</th>

<th>ESTADO FISE</th>

<th>OBSERVACIONES</th>

</tr>

</thead>



<tbody id="resultBody">

</tbody>


</table>


</div>




<script>



function cambiarPlaceholder(){


let tipo =

document.getElementById(
"tipoBusqueda"
).value;


let input =

document.getElementById(
"datoInput"
);


if(tipo=="DNI"){

input.placeholder=

"Ingrese DNI";

}


else{

input.placeholder=

"Ingrese número de suministro";

}


}





async function cargarArchivosJSON(){

try{

const index=

await fetch(
"index.json"
);

return await index.json();

}

catch(error){

console.error(error);

return [];

}

}





async function buscar(){


const tipoBusqueda =

document.getElementById(
"tipoBusqueda"
).value;



const valor =

document.getElementById(
"datoInput"
)

.value

.trim();



const resultado =

document.getElementById(
"resultado"
);



const cuerpo =

document.getElementById(
"resultBody"
);



const loading =

document.getElementById(
"loading"
);



resultado.style.display="none";

cuerpo.innerHTML="";

loading.style.display="block";




if(!valor){

loading.style.display="none";

resultado.style.display=
"table";


cuerpo.innerHTML=

`
<tr>

<td colspan="6">

⚠️ Ingrese un dato válido

</td>

</tr>

`;

return;

}



const archivos =

await cargarArchivosJSON();


let encontrado=null;



for(const archivo of archivos){


try{


const response =

await fetch(archivo);


const data =

await response.json();



encontrado =

data.find(item =>


String(

item[tipoBusqueda] || ""

)

.trim()

.toUpperCase()

===


String(valor)

.trim()

.toUpperCase()


);



if(encontrado){

break;

}



}catch(error){

console.error(

"Error:",

error

);

}


}



loading.style.display=
"none";



if(!encontrado){


cuerpo.innerHTML=

`

<tr>

<td colspan="6">

❌ No se encontró información

</td>

</tr>

`;



}else{


cuerpo.innerHTML=


`

<tr>

<td>

${encontrado["DNI"]}

</td>


<td>

${encontrado["SUMINISTRO"]}

</td>


<td>

${encontrado["NOMBRE DEL USUARIO"]}

</td>


<td>

${encontrado["TIPO DE BENEFICIARIO"]}

</td>


<td>

${encontrado["ESTADO FISE"]}

</td>


<td>

${encontrado["OBSERVACIONES"]}

</td>


</tr>

`;


}



resultado.style.display=
"table";


}



</script>


</body>

</html>
